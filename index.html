<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kiruthika Portfolio</title>

<style>

/* ===== Animated Gradient Background ===== */
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    color: white;
    height: 100vh;
    background: linear-gradient(-45deg, #0f2027, #203a43, #2c5364, #000428);
    background-size: 400% 400%;
    animation: gradientBG 12s ease infinite;
}

/* Background animation */
@keyframes gradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

/* ===== Main Container ===== */
.main-container {
    width: 85%;
    margin: 50px auto;
}

/* ===== Glass Section ===== */
.section {
    background: rgba(0, 0, 0, 0.35);
    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);

    border-radius: 18px;
    padding: 30px;
    margin-bottom: 30px;

    border: 1px solid rgba(255, 255, 255, 0.2);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
}

h1 { font-size: 36px; margin-bottom: 5px; }
h2 { border-left: 4px solid #00ffff; padding-left: 10px; }

p, li {
    line-height: 1.6;
    text-shadow: 0 0 6px rgba(0,0,0,0.6);
}

ul { padding-left: 20px; }

.footer {
    text-align: center;
    padding: 20px;
    font-size: 14px;
    opacity: 0.8;
}

</style>
</head>

<body>

<div class="main-container">

    <div class="section">
        <h1>Kiruthika</h1>
        <p>ECE Student | Industrial Automation Enthusiast | Problem Solver</p>
    </div>

    <div class="section">
        <h2>Profile Summary</h2>
        <p>
            Focused and detail-oriented Electronics and Communication Engineering student with CGPA 8.23...
        </p>
    </div>

</div>

<div class="footer">
    © 2026 Kiruthika | Built with precision & purpose
</div>

</body>
</html>
